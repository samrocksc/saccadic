<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saccadic — Speed Reading, Your Way</title>
  <meta name="description" content="Paste any text and read it one word at a time at your own pace — paste mode, voice input, save your books and pick up where you left off." />

  <!-- Inline SVG favicon: the app's own focal mark (guide lines + ORP tick). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Crect y='6' width='32' height='2' fill='%23000'/%3E%3Crect y='24' width='32' height='2' fill='%23000'/%3E%3Crect x='15' y='8' width='2' height='5' fill='%23f0f'/%3E%3Crect x='15' y='19' width='2' height='5' fill='%23f0f'/%3E%3Ctext x='16' y='20' font-family='monospace' font-size='12' font-weight='700' text-anchor='middle' fill='%23000'%3Ea%3C/text%3E%3C/svg%3E" />

  <!-- Theme + custom ORP color: prevent flash of wrong values.
       Key strings must match THEME_KEY / ORP_COLOR_KEY in src/themes/themes.js. -->
  <script>
    (function() {
      // localStorage throws in private mode / when site data is blocked.
      var savedTheme = null, savedOrp = null;
      try {
        savedTheme = localStorage.getItem('saccadic-theme');
        savedOrp = localStorage.getItem('saccadic-orp-color');
      } catch (e) {}

      var choice = savedTheme || 'cowabunga';
      var resolved = choice;
      if (choice === 'system') {
        resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.setAttribute('data-theme-choice', choice);
      if (savedOrp) document.documentElement.style.setProperty('--sacc-orp', savedOrp);
    })();
  </script>

  <!-- Google Fonts: Cowabunga theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── CSS Custom Properties (base defaults — themes override) ── */
    :root {
      --sacc-font: 'IBM Plex Mono', 'Space Mono', 'Fira Mono', 'Cascadia Code', monospace;

      /* Cowabunga theme defaults */
      --sacc-bg:      #ffffff;
      --sacc-text:    #000000;
      --sacc-accent:  #ff00ff;
      --sacc-muted:   #666666;
      --sacc-surface: #f5f5f5;
      --sacc-border:  #000000;
      --sacc-line:    #000000;
      --sacc-orp:     #ff00ff;
    }

    /* ── Global ────────────────────────────── */
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--sacc-font);
      background: var(--sacc-bg);
      color: var(--sacc-text);
      min-height: 100dvh;
      transition: background 200ms ease, color 200ms ease;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Space Mono', var(--sacc-font);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--sacc-bg); }
    ::-webkit-scrollbar-thumb { background: var(--sacc-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--sacc-muted); }

    /* Text selection */
    ::selection {
      background: var(--sacc-accent);
      color: #ffffff;
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid var(--sacc-accent);
      outline-offset: 2px;
    }

    /* saccadic-app fills the viewport */
    saccadic-app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      /* Prevent pull-to-refresh and rubber-banding overscroll on mobile */
      overscroll-behavior: none;
    }

    /* Touch: disable tap highlight everywhere */
    * {
      -webkit-tap-highlight-color: transparent;
    }

    /* Smooth scroll on mobile */
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    /* Ensure buttons and interactive elements are comfortable touch targets */
    button, [role="button"] {
      min-height: 44px;
      min-width: 44px;
    }

    /* ── Cowabunga retro styling ───────────────────────────── */
    [data-theme="cowabunga"] saccadic-app::part(container),
    [data-theme="cowabunga"] .controls-area {
      /* components render in shadow DOM, so we style host-level chrome below */
    }

    [data-theme="cowabunga"] ::-webkit-scrollbar-thumb {
      background: #000000;
    }

    /* ── Reduced motion ─────────────────────────────────────
       RSVP is a rapid-flashing interface; honour the OS request to
       tone movement down rather than only easing colour transitions. */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

</head>
<body>
  <saccadic-app></saccadic-app>
  <script type="module" src="./src/components/saccadic-app.js"></script>
</body>
</html>
